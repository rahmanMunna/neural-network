# #region nginx
# The pool of application servers. Nginx rotates through them for each request.
upstream api {
    server host.docker.internal:3001;
    server host.docker.internal:3002;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Reject oversized bodies here, before they reach the application.
    client_max_body_size 1m;

    # Static files are served directly, without touching the application.
    location /static/ {
        root /var/www;
        expires 7d;
    }

    location / {
        proxy_pass http://api;

        # Reuse upstream connections instead of opening one per request.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Tell the application who really called. Clients can send these headers
        # themselves, so an edge proxy must overwrite them, never append to them.
        # Otherwise a forged address reaches the app and defeats IP rate limits.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Give up on a slow server rather than holding the connection open.
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
# #endregion
